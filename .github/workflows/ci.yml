name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  build:
    name: Build plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --target wasm32-wasip2

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: rookperms-wasm
          path: target/wasm32-wasip2/release/rookperms.wasm
          if-no-files-found: error

  test:
    name: Test api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test -p rookperms-api --target x86_64-unknown-linux-gnu --all-targets

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy plugin
        run: cargo clippy --workspace --target wasm32-wasip2 -- -D warnings

      - name: Clippy api
        run: cargo clippy -p rookperms-api --target x86_64-unknown-linux-gnu --all-targets -- -D warnings
